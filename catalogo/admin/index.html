<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AndiWorks | Product builder (interno)</title>
  <link rel="icon" href="../../favicon.ico?v=20261005b" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="../../assets/logo-web.svg?v=20261005b">
  <link rel="apple-touch-icon" href="../../assets/logo-ios.png?v=20261005a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/admin.css?v=20261005a">
</head>
<body>
  <header class="pb-top">
    <p class="pb-brand">AndiWorks <span>Product builder</span></p>
    <div class="pb-seg" role="radiogroup" aria-label="Catálogo de destino">
      <button type="button" role="radio" data-cat="laser">Láser</button>
      <button type="button" role="radio" data-cat="muebles">Muebles</button>
    </div>
  </header>

  <main class="pb-main">
    <!-- ── Columna izquierda: ficha ───────────────────────────── -->
    <section class="pb-form">

      <div class="pb-block">
        <h2 class="pb-h"><b>1</b> Ficha</h2>
        <div class="pb-grid">
          <label class="pb-f pb-f-num">
            <span>Nº</span>
            <input id="f-num" inputmode="numeric" maxlength="3" autocomplete="off">
          </label>
          <label class="pb-f pb-f-name">
            <span>Nombre</span>
            <input id="f-name" placeholder="Ej: Repisero Piercings Dorado" maxlength="80" autocomplete="off">
          </label>
          <label class="pb-f pb-f-year">
            <span>Año</span>
            <input id="f-year" inputmode="numeric" maxlength="4" autocomplete="off">
          </label>
        </div>
        <p class="pb-note" id="num-note"></p>

        <label class="pb-f">
          <span>Descripción <em id="desc-hint"></em></span>
          <textarea id="f-desc" rows="2" maxlength="280"></textarea>
        </label>

        <!-- Solo catálogo de muebles -->
        <div class="pb-grid pb-only-muebles">
          <label class="pb-f pb-f-cat">
            <span>Categoría</span>
            <input id="f-cat" list="cat-list" placeholder="Mobiliario" autocomplete="off">
            <datalist id="cat-list">
              <option value="Mobiliario"></option>
              <option value="Espejos"></option>
              <option value="Iluminación"></option>
              <option value="Objetos"></option>
              <option value="Señalética"></option>
            </datalist>
          </label>
          <label class="pb-f pb-f-dim"><span>Largo</span><input data-dim="0" placeholder="—" autocomplete="off"></label>
          <label class="pb-f pb-f-dim"><span>Ancho</span><input data-dim="1" placeholder="—" autocomplete="off"></label>
          <label class="pb-f pb-f-dim"><span>Alto</span><input data-dim="2" placeholder="—" autocomplete="off"></label>
        </div>
      </div>

      <div class="pb-block">
        <h2 class="pb-h"><b>2</b> Fotos y videos <em>★ = portada de la card</em></h2>
        <label class="pb-drop" id="drop">
          <input type="file" id="f-files" multiple accept="image/*,video/*,.webp,.webm">
          <strong>Arrastra los archivos aquí</strong>
          <span>o haz clic para elegirlos · se respeta su formato (webp, webm, mp4…)</span>
        </label>
        <ol class="pb-tiles" id="tiles"></ol>

        <!-- Solo catálogo de muebles -->
        <div class="pb-only-muebles pb-3d">
          <label class="pb-check"><input type="checkbox" id="f-3d"> Tiene modelo 3D (.glb)</label>
          <label class="pb-check" id="f-3d-cover-wrap" hidden><input type="checkbox" id="f-3d-cover"> Usarlo como portada</label>
        </div>
      </div>

      <details class="pb-block pb-links">
        <summary class="pb-h"><b>3</b> Contacto <em id="links-summary"></em></summary>
        <div class="pb-grid">
          <label class="pb-f pb-f-half"><span>WhatsApp (sin +)</span><input id="f-wa" autocomplete="off"></label>
          <label class="pb-f pb-f-half"><span>Instagram (URL o @usuario)</span><input id="f-ig" autocomplete="off"></label>
        </div>
      </details>
    </section>

    <!-- ── Columna derecha: resultado ─────────────────────────── -->
    <aside class="pb-out">
      <div class="pb-out-top">
        <div class="pb-card" id="card">
          <div class="pb-card-media" id="card-media"></div>
          <span class="pb-card-tag" id="card-tag"></span>
        </div>

        <div class="pb-names">
          <p class="pb-label">Nombres · clic para copiar</p>
          <ul class="pb-chips" id="chips"></ul>
          <button type="button" class="pb-btn" id="zip-btn">Descargar carpeta .zip</button>
          <p class="pb-tiny">La carpeta ya trae los archivos renombrados: descomprímela dentro de <code id="dest-path"></code></p>
        </div>
      </div>

      <div class="pb-code-wrap">
        <div class="pb-code-head">
          <p class="pb-label">Código para <code id="code-target"></code> <span id="code-missing"></span></p>
          <button type="button" class="pb-btn pb-btn-dark" id="copy-code">Copiar código</button>
        </div>
        <pre class="pb-code" id="code"></pre>
      </div>
    </aside>
  </main>

  <script src="assets/admin.js?v=20261005a" defer></script>
</body>
</html>
